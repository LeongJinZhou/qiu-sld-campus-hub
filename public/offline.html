<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FDDA1A">
    <title>Offline · QIU Campus Hub</title>
    <style>
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f6f8; color: #14213d; font: 16px/1.5 Poppins, system-ui, sans-serif; }
        main { max-width: 22rem; padding: 2rem 1rem; text-align: center; }
        img { height: 72px; }
        button { margin-top: 1rem; padding: .6rem 1.4rem; border: 0; border-radius: .75rem; background: #14213d; color: #fff; font: inherit; }
    </style>
</head>
<body>
<main>
    <img src="/icons/icon-192.png" alt="QIU Student Activity">
    <h1>You're offline</h1>
    <p>Campus Hub needs a connection to load clubs, events and forms. Your drafts are saved on the server, so nothing is lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
