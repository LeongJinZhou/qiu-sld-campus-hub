name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, gd, zip, intl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: cp .env.example .env && php artisan key:generate && php artisan route:list > /dev/null
